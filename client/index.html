        {
          "@type": "Question",
          "name": "What is a Refundable Accommodation Deposit (RAD)?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A RAD is a lump sum payment made to an aged care facility for accommodation. It is refundable when you leave the facility, minus any applicable retention amounts (up to 2% per year, capped at 10% total). You can choose to pay a RAD, a Daily Accommodation Payment (DAP), or a combination of both."
          }
        },
        {
          "@type": "Question",
          "name": "What is the difference between a RAD and a DAP?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A RAD (Refundable Accommodation Deposit) is a lump sum payment that is refundable when you leave care. A DAP (Daily Accommodation Payment) is a daily rental payment calculated on the RAD amount using the Maximum Permissible Interest Rate (MPIR). You can pay all RAD, all DAP, or a combination of both."
          }
        },
        {
          "@type": "Question",
          "name": "How much does aged care cost in Australia?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Aged care costs vary significantly based on your income, assets, and the facility chosen. Costs include accommodation payments (RAD/DAP ranging from $0 to $550,000+), basic daily fees (85% of the single Age Pension, currently around $60/day), and means-tested care fees (up to $33,000/year cap). The Aged Care Decision Guide provides detailed breakdowns and calculation tools."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need an ACAT assessment for aged care?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, you need an Aged Care Assessment Team (ACAT) assessment before entering permanent residential aged care in Australia. The ACAT assesses your care needs and determines your eligibility for government-funded aged care services."
          }
        },
        {
          "@type": "Question",
          "name": "How do I choose the right aged care facility?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Choosing the right facility involves visiting multiple facilities, checking star ratings on My Aged Care, understanding costs (RAD/DAP), reviewing contracts carefully, considering location and family access, evaluating staff ratios and quality of care, and checking facilities' accreditation status. The Aged Care Decision Guide includes comprehensive checklists for facility evaluation."
          }
        },
        {
          "@type": "Question",
          "name": "Can the RAD be refunded to my estate?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, the RAD (minus any retention amounts and unpaid fees) is refundable to your estate when you permanently leave the facility, including upon death. Facilities must refund the balance within 14 days of receiving all required documentation."
          }
        },
        {
          "@type": "Question",
          "name": "What is means testing for aged care?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Means testing assesses your income and assets to determine how much you contribute to your aged care costs. Services Australia conducts the assessment and determines if you pay a means-tested care fee (in addition to basic fees). Your family home may be exempt or partially exempt depending on your circumstances."
          }
        },
        {
          "@type": "Question",
          "name": "How long does it take to get into aged care?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "After receiving ACAT approval, entry timeframes vary by facility availability and urgency. Some facilities have immediate vacancies, while popular facilities may have waiting lists. Emergency placements can occur within days. It's recommended to research and shortlist facilities before they're urgently needed."
          }
        }
      ]
